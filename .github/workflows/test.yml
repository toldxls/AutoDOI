name: tests
on:
  push:
  pull_request:

# Actions are pinned to commits (the comment names the tag; Dependabot moves both together).
permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node || matrix.file }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 18      # the oldest version the library and the CLI support (package.json "engines")
          - file: .nvmrc  # the version the browser job and the deploy use
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          node-version-file: ${{ matrix.file }}
      - name: index.html and apps-script/Citations.gs are rebuilt from the library sources
        run: |
          sh build.sh
          git diff --exit-code -- index.html apps-script/Citations.gs || (echo "Run ./build.sh and commit the result" && exit 1)
      - name: Unit suites, smoke checks, syntax and version consistency
        run: node tests/run.js

  browser:
    name: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The suite fetches the citation engine, two styles and two locales once into tests/browser/cache/ (gitignored); keyed on the
      # page's pins, the cache is reused until a pin moves, so the suite stays offline in CI too.
      - name: Read the pins the page uses
        id: pins
        run: |
          styles=$(grep -o "CSL_STYLES_COMMIT = '[0-9a-f]*'" index.html | grep -o '[0-9a-f]\{40\}')
          locales=$(grep -o "CSL_LOCALES_COMMIT = '[0-9a-f]*'" index.html | grep -o '[0-9a-f]\{40\}')
          citeproc=$(grep -o "citeproc@[0-9.]*" index.html | head -1 | tr "@" "-")
          echo "key=browser-cache-$styles-$locales-$citeproc" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tests/browser/cache
          key: ${{ steps.pins.outputs.key }}
      - name: Page smoke tests and axe accessibility checks (offline, APIs mocked)
        run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: browser-test-output
          path: tests/browser/out/
          if-no-files-found: ignore

  # The page reaches GitHub Pages only after both jobs pass on main, so a broken push never deploys.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      # Only what the page serves: itself, the worker and its manifest and icon, the data/ files it fetches, the libraries
      # (for anyone who wants them unbundled) and the licence; not the tests, fixtures, tooling or the Sheets script.
      - name: Assemble the site
        run: |
          mkdir dist
          cp index.html sw.js manifest.webmanifest icon.svg citations.js parsers.js sentencecase.js LICENSE dist/
          cp -R data dist/data
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
